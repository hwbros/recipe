<main>
  <section class="recipe" id="soboro">
    <div class="recipe-header">
      <span class="recipe-num">15</span>
      <h2>소보로 덮밥</h2>
    </div>

    <h3 class="section-title">재료</h3>
    <ul class="ingredient-list">
      <li>따뜻한 밥: 1공기 (약 200g)</li>
      <li>다진 돼지고기 (뒷다리살): 150g</li>
      <li>계란: 3개</li>
      <li>대파: 1/2대</li>
      <li>통깨, 후추: 약간씩</li>
    </ul>

    <div class="sub-ingredient">
      <span class="sub-title">계란 밑간</span>
      <ul class="ingredient-list">
        <li>소금: 1~2꼬집</li>
        <li>설탕: 1~2꼬집</li>
      </ul>
    </div>

    <div class="sub-ingredient">
      <span class="sub-title">고기 양념</span>
      <ul class="ingredient-list">
        <li>다진 마늘: 0.5스푼</li>
        <li>진간장: 2스푼</li>
        <li>설탕: 1스푼</li>
        <li>식초: 1스푼</li>
      </ul>
    </div>
  </section>
